{% extends "base.html" %}
{% block title %}Verify Email — CampusVote{% endblock %}

{% block content %}
<div class="card">
    <h1 class="card__title">Check your email</h1>
    <p class="card__subtitle">We sent a 4-digit code to <strong>{{ user_email }}</strong></p>

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="{{ form.code.id_for_label }}">Verification code</label>
            <input
                type="text"
                name="{{ form.code.name }}"
                id="{{ form.code.id_for_label }}"
                maxlength="4"
                placeholder="0000"
                autocomplete="one-time-code"
                inputmode="numeric"
                class="otp-input"
                required
            >
            {{ form.code.errors }}
        </div>

        <button type="submit">Verify</button>
    </form>

    <hr class="divider">

    <form method="post" action="{% url 'resend_otp' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn--ghost">Resend code</button>
    </form>
</div>
{% endblock %}
